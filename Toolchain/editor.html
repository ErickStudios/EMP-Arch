<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenguaje Personalizado en Monaco Editor</title>
    <style>
        #editor-container {
            width: 800px;
            height: 500px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div id="editor-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            
            // 1. Registrar el ID del nuevo lenguaje
            monaco.languages.register({ id: 'mi-lenguaje' });

            // 2. Definir las reglas de resaltado de sintaxis (Monarch tokens)
            monaco.languages.setMonarchTokensProvider('mi-lenguaje', {
                operators: [
                    '=', '==', '!=', '+', '-', '*', '/'
                ],

                symbols: /[=><!~?:&|+\-*\/\^%]+/,

                tokenizer: {
                    root: [
                        // Primero los números/direcciones con sufijo o prefijo de símbolo para que no los tome como texto
                        [/[a-fA-F0-9_.]+h/i, 'number'],
                        [/0x[a-fA-F0-9.]+/, 'number'],
                        [/\d+/, 'number'],

                        [/\b\w+\b\:/i, 'variable'],
                        [/\b(\$|#|\%)\b/, 'types'],

                        [/\b(rsv|local|reserve|li|dw|dq|dd|db|byte|word|half)\b/i, 'keyword.flow'],
                        [/\b(add|addi|sub|subi|mul|muli|div|divi|and|andi|orb|orbi|xor|xori|lw|sw|lh|sh|lb|sb|ml|mh|mxl|jf)\b/i, 'keyword'],
                        [/\w+h?/i, 'variable'],

                        // Comentarios
                        [/#[^\n]*$/, 'comment'],

                        // Cadenas de texto
                        [/"([^"\\]|\\.)*$/, 'string.invalid'],
                        [/"/, { token: 'string.quote', bracket: '@open', next: '@string' }],
                        
                        [/\b\w+\b/, 'keyword']
                        
                    ],

                    string: [
                        [/[^"\\]+/, 'string'],
                        [/\\./, 'string.escape'],
                        [/"/, { token: 'string.quote', bracket: '@close', next: '@pop' }]
                    ]
                }
            });

            // 4. Crear la instancia del editor usando tu nuevo lenguaje
            var editor = monaco.editor.create(document.getElementById('editor-container'), {
                language: 'mi-lenguaje',
                theme: 'vs-dark'
            });

            window.edit0 = editor
        });
    </script>
</body>
</html>
